<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Road Rush — game menghindari mobil berbasis HTML5 dan Phaser.">
  <title>Road Rush — Hindari Mobil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <h1>ROAD RUSH</h1>
    <p class="hint">Hindari mobil lain selama mungkin!</p>
    <div id="game" aria-label="Area permainan Road Rush"></div>
    <p class="footer">Gerak: <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> · Restart: <kbd>SPASI</kbd></p>
    <p class="footer">Tip: klik area game jika keyboard belum merespons.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
